version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-staging_erp}
      POSTGRES_USER: ${POSTGRES_USER:-staging_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staging_pass}
    ports:
      - "5432:5432"

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../../.env.staging

  frontend:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "8080:80"
