version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-college_erp}
      POSTGRES_USER: ${POSTGRES_USER:-erp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_prod_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp_user} -d ${POSTGRES_DB:-college_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.backend
    restart: always
    env_file:
      - ../../.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.celery
    restart: always
    env_file:
      - ../../.env.production
    depends_on:
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.celery-beat
    restart: always
    env_file:
      - ../../.env.production
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
